# O cloudflared (ou outro proxy) chega aqui em HTTP; o HTTPS fica no Cloudflare.
# Repassa o esquema original para o Django saber que a conexão é segura.
map $http_x_forwarded_proto $esquema {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Faturas em PDF podem ser grandes, mas não precisam passar disso
  client_max_body_size 20m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # DNS do Docker: resolve o backend a cada 30s, então recriar só a API
  # (num deploy) não deixa o nginx apontando para o IP antigo.
  resolver 127.0.0.11 valid=30s ipv6=off;
  set $api http://backend:8000;

  # API, admin e arquivos do admin vão para o Django
  location ~ ^/(api|admin|static)/ {
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $esquema;
    proxy_read_timeout 120s;
  }

  # Rotas do React Router caem no index.html
  location / {
    try_files $uri /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
