name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: financas
          POSTGRES_USER: financas
          POSTGRES_PASSWORD: financas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U financas"
          --health-interval 3s
          --health-retries 20
    env:
      DJANGO_DEBUG: "1"
      DATABASE_URL: postgres://financas:financas@localhost:5432/financas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem de produção do front
        run: docker build --target prod -t financas-frontend ./frontend
      - name: Build da imagem de produção da API
        run: docker build --target prod -t financas-backend ./backend
